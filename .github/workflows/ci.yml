# Runs the tests. All three languages, because all three ship.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        # Not a style preference: an unformatted diff makes every later review
        # noisier than it needs to be.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: composer tests
        working-directory: composer
        run: python3 -m unittest discover -p 'test_*.py' -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: studio tests
        working-directory: internal/studio/assets
        run: |
          node state.test.js
          node load.test.js
          node timeline.test.js
          node room3d.test.js

  web:
    # The new studio: the editing core and the renderer that will replace the
    # hand-written timeline. Separate from the `javascript` job because it has
    # a lockfile and a toolchain and that one deliberately has neither.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: types
        working-directory: web
        run: npm run typecheck
      - name: tests
        # Includes the performance budget: a two hour score across eight lanes
        # must draw in a bounded number of primitives. That test is the guard
        # against anyone reintroducing per-point drawing, which is what made
        # the previous timeline unable to hold a feature film.
        working-directory: web
        run: npm test

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no CRLF
        # Authoring happens on Windows, where CRLF is introduced at the moment
        # a file is written. .gitattributes normalises the committed blob, but
        # this catches anything that slips past it.
        run: |
          bad=$(git grep -lI $'\r' -- . || true)
          if [ -n "$bad" ]; then
            echo "files with CRLF line endings:"; echo "$bad"; exit 1
          fi

  smoke:
    # Builds the binary and runs it against the example score and rig. The unit
    # tests cover the pieces; this is the only job that checks they still add up
    # to a working program.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -o componium ./cmd/componium
      - name: validate the example score against the example rig
        run: ./componium validate -score examples/demo.componium -rig examples/demo-rig.toml
      - name: the full rig example must also parse
        run: ./componium validate -score examples/demo.componium -rig examples/full-rig.toml
      - name: composer output must satisfy the parser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          sh hack/make-testclips.sh "$RUNNER_TEMP"
          python3 composer/compose.py "$RUNNER_TEMP/componium-subbed.mkv" \
            -o "$RUNNER_TEMP/generated.componium" --media-fps 24
          ./componium validate -score "$RUNNER_TEMP/generated.componium"

  image:
    # Only after everything else passes. Publishing an image that fails its own
    # tests would make the registry a worse source of truth than the repository.
    needs: [go, python, javascript, web, line-endings, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both tags on purpose: main is what the demonstration box follows,
          # and the sha is what you name when something needs pinning or
          # rolling back.
          tags: |
            ghcr.io/slicit/componium:main
            ghcr.io/slicit/componium:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
