# Blocks a pull request until its author has signed the CLA.
#
# This is the mechanism, not a formality. Componium is dual licensed, and that
# only survives while one party holds sufficient rights over the whole
# codebase. A single merge from an unsigned contributor ends the commercial
# option permanently and irreversibly, which is exactly the kind of mistake a
# human reviewer makes at 1am and cannot undo.
#
# SETUP:
#
#   Probably none. Signatures are stored in this repository, and the action's
#   own documentation says PERSONAL_ACCESS_TOKEN is needed only when they
#   live in a different one. Its environment variable table contradicts that
#   and calls the token required, so if a run fails complaining about it,
#   create a repository secret named PERSONAL_ACCESS_TOKEN holding a classic
#   PAT with repo scope. Referencing a secret that does not exist is
#   harmless: it substitutes to an empty string.
#
# Contributors sign by commenting on their own pull request. No forms.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the signature
        if: >
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Slicit/componium/blob/main/CLA/icla.txt
          branch: main
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged you need to
            sign the Contributor License Agreement, which is
            [CLA/icla.txt](https://github.com/Slicit/componium/blob/main/CLA/icla.txt),
            and [CLA/README.md](https://github.com/Slicit/componium/blob/main/CLA/README.md)
            explains why it exists. It is the Apache ICLA with the receiving
            party changed, so you may well have signed one before.
            To sign, reply to this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
