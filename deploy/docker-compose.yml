# A running Componium, with no hardware.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://<host>:8722
#
# Five containers from one image: something to play, something to follow it,
# something to be an instrument, and the studio to edit what it plays.
#
# Nothing here touches a physical device. Every instrument is either virtual or
# a software node, which is the same thing a contributor with no rig would run.

name: componium

# Every container that touches a bind mount runs as the host user. The image
# has its own unprivileged user, which is right for a container writing only
# to its own volumes and wrong the moment it writes to a directory somebody
# owns: the uid inside would not match the uid outside and every write is
# refused. Override with COMPONIUM_UID and COMPONIUM_GID if yours differ.
x-user: &asuser
  user: "${COMPONIUM_UID:-1000}:${COMPONIUM_GID:-1000}"

x-image: &image
  image: ${COMPONIUM_IMAGE:-ghcr.io/slicit/componium:main}

services:
  # Generates the demonstration clip once, then exits. The player waits for it.
  clips:
    <<: [*image, *asuser]
    entrypoint: ["sh", "/opt/componium/hack/make-testclips.sh", "/media"]
    volumes:
      - ${COMPONIUM_MEDIA:-./media}:/media
    restart: "no"

  # Seeds an editable copy of the score. The studio writes to this, and the
  # conductor plays it, so an edit in the browser is heard on the next pass.
  scores:
    <<: [*image, *asuser]
    entrypoint:
      - sh
      - -c
      - 'test -f /scores/demo.componium || cp /opt/componium/examples/demo.componium /scores/demo.componium'
    volumes:
      - ${COMPONIUM_SCORES:-./scores}:/scores
    restart: "no"

  # mpv is the reference time source: it reports position once per frame, which
  # is what makes a 3ms clock possible. Headless, looping forever.
  player:
    <<: [*image, *asuser]
    entrypoint:
      - mpv
      - --no-config
      - --vo=null
      - --ao=null
      - --loop=inf
      - --input-ipc-server=/run/componium/mpv.sock
      - /media/componium-testclip.mkv
    volumes:
      - ${COMPONIUM_MEDIA:-./media}:/media
      - ipc:/run/componium
    depends_on:
      clips:
        condition: service_completed_successfully
    restart: unless-stopped

  # A software instrument. Exactly what the ESP32 firmware does, minus the pins,
  # so the protocol is exercised for real rather than simulated.
  node:
    <<: [*image, *asuser]
    command:
      - node
      - -id=wind.main
      - -kind=wind
      - -addr=0.0.0.0:5570
      - -latency=1200ms
    restart: unless-stopped

  # The conductor. Follows the player, dispatches cues early by each
  # instrument's declared latency, and drives the node over the network.
  conductor:
    <<: [*image, *asuser]
    entrypoint:
      - sh
      - -c
      - |
        # Bounded, and loud when it expires. An unbounded `until` here waits
        # forever on a socket that is never coming, and the container sits
        # there reporting Up while doing nothing at all — which is a worse
        # failure than crashing, because it looks like success.
        n=0
        until [ -S /run/componium/mpv.sock ]; do
          n=$$((n + 1))
          if [ $$n -gt 150 ]; then
            echo "no mpv socket after 30s: is the player running, and can it" >&2
            echo "write to /run/componium? (a named volume seeded from an" >&2
            echo "image path owned by another uid is the usual cause)" >&2
            exit 1
          fi
          sleep 0.2
        done
        exec componium play \
          -score /scores/demo.componium \
          -rig /rigs \
          -socket /run/componium/mpv.sock
    volumes:
      - ipc:/run/componium:ro
      - ${COMPONIUM_SCORES:-./scores}:/scores:ro
      # The shelf, read only. A directory rather than a file, so this plays
      # whichever rig was picked in the studio without either of them having
      # been told anything.
      - ${COMPONIUM_RIGS:-./rigs}:/rigs:ro
    depends_on:
      player:
        condition: service_started
      node:
        condition: service_started
      scores:
        condition: service_completed_successfully
    restart: unless-stopped

  # The timeline editor. This is the part with a URL.
  studio:
    <<: [*image, *asuser]
    command:
      - studio
      - -score=/scores/demo.componium
      - -rig=/rigs
      - -media=/media
      - -scores=/scores
      # Images the admin page can flash to a board over USB. A build artifact
      # of a different toolchain, so it is mounted rather than baked in;
      # absent is fine and the page says so.
      - -firmware=/firmware
      - -addr=0.0.0.0:8722
    # The vision seam, off unless a command is named. Analysis works without
    # it; naming one turns keyframe labelling on for every film analysed here.
    environment:
      COMPONIUM_VLM_COMMAND: ${COMPONIUM_VLM_COMMAND:-}
      COMPONIUM_VLM_FRAMES: ${COMPONIUM_VLM_FRAMES:-}
      COMPONIUM_VLM_EVERY: ${COMPONIUM_VLM_EVERY:-}
      COMPONIUM_VLM_WORKERS: ${COMPONIUM_VLM_WORKERS:-}
      COMPONIUM_VLM_HOST: ${COMPONIUM_VLM_HOST:-}
      COMPONIUM_VLM_MODEL: ${COMPONIUM_VLM_MODEL:-}
      COMPONIUM_VLM_API: ${COMPONIUM_VLM_API:-}
    volumes:
      - ${COMPONIUM_MEDIA:-./media}:/media
      # Writable, and only here. The admin edits the rig files rather than
      # keeping copies of them, which is what stops the studio and the
      # conductor ending up with different ideas about what is on the end of a
      # wire. The conductor keeps its read only mount: it reads these, never
      # writes them.
      #
      # A directory rather than a file, which also restores the atomic save: a
      # single file bind mount has no writable directory to put a temp file in.
      - ${COMPONIUM_RIGS:-./rigs}:/rigs
      - ${COMPONIUM_SCORES:-./scores}:/scores
      - ${COMPONIUM_FIRMWARE:-../firmware/esp32/web}:/firmware:ro
    ports:
      - "8722:8722"
    depends_on:
      clips:
        condition: service_completed_successfully
      scores:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  # Only one named volume, and it holds nothing anybody would miss.
  #
  # Films and scores are bind mounts instead, under COMPONIUM_MEDIA and
  # COMPONIUM_SCORES, so they can be dropped in, backed up and deleted from
  # outside a container. A named volume would put the user's own files
  # somewhere only Docker can reach.
  #
  # The mpv IPC socket is different: it is a unix socket that exists only while
  # the stack runs, and putting it on a shared volume is how the conductor
  # reaches the player without either of them needing a network.
  ipc:
