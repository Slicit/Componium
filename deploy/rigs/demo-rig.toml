# The rig the demonstration stack runs. wind.main is a real CIP node reached
# over the network; the lights are virtual, so the conductor logs what it would
# have sent to a fixture.
#
# The position blocks are what the studio's room preview draws from. Metres,
# origin at the centre of the screen wall: x right, y up, z toward the
# audience. Leave them out and the studio picks a sensible spot for the kind.

[rig]
name = "demonstration, no hardware"

[[instrument]]
id = "wind.main"
kind = "wind"
driver = "cip"
addr = "node:5570"
[instrument.position]
x = 0.0
y = 1.7
z = 0.7

# The soft wash, behind the screen. Ceilinged, so it never competes with the
# event layer above it.
[[instrument]]
id = "light.ambient"
kind = "light"
driver = "virtual"
latency = "20ms"
[instrument.position]
x = 0.0
y = 1.4
z = -0.1

# The event layer: lightning and explosions, overhead and punchy.
[[instrument]]
id = "light.event"
kind = "light"
driver = "virtual"
latency = "20ms"
[instrument.position]
x = 0.0
y = 2.5
z = 1.2

[[instrument]]
id = "shake.seat"
kind = "shake"
driver = "virtual"
latency = "5ms"
[instrument.position]
x = 0.0
y = 0.35
z = 3.0

# The rest of the room. All virtual: the conductor logs what it would have sent
# and nothing is driven, but the studio's room preview has every device kind in
# it, which is what makes toggling one at a time worth doing.

[[instrument]]
id = "motion.platform"
kind = "motion"
driver = "virtual"
latency = "60ms"
[instrument.position]
x = 0.0
y = 0.5
z = 3.0

[[instrument]]
id = "mist.main"
kind = "mist"
driver = "virtual"
latency = "200ms"
[instrument.position]
x = 0.0
y = 2.4
z = 2.2

[[instrument]]
id = "fog.left"
kind = "fog"
driver = "virtual"
latency = "2s"
[instrument.position]
x = -1.8
y = 0.15
z = 1.0

[[instrument]]
id = "scent.main"
kind = "scent"
driver = "virtual"
latency = "1s"
[instrument.position]
x = 1.8
y = 1.1
z = 2.6

# What each reservoir holds. A score names a smell and this says which
# bottle that is here; one this rig does not hold is not fired at all
# rather than approximated, because an approximation of a smell is a
# different smell and a room cannot be aired out mid-scene.
#
# The five that cover the most films at their strongest moments:
# burning, weather, water, vegetation, underground. Ten and fifteen are
# more rows here and no code.
[instrument.scents]
1 = "smoke"
2 = "petrichor"
3 = "sea"
4 = "pine"
5 = "earth"

